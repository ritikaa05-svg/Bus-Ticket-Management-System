<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Route</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Add New Route</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Origin</label>
                            <input type="text" class="form-control" name="origin" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Destination</label>
                            <input type="text" class="form-control" name="destination" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Departure Time</label>
                            <input type="time" class="form-control" name="departure_time" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" name="date" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Price (Rs. )</label>
                            <input type="number" step="0.01" class="form-control" name="price" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Bus Number</label>
                            <input type="text" class="form-control" name="bus_number" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Driver Name</label>
                            <input type="text" class="form-control" name="driver_name" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Driver Contact</label>
                            <input type="text" class="form-control" name="driver_contact" required>
                        </div>
			<div class="col-md-4">
    				<label class="form-label">Total Seats</label>
    				<input type="number" class="form-control" name="total_seats" value="{{ route.total_seats if route else 30 }}" required min="10" max="100">
			</div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Add Route
                            </button>
                            <a href="{{ url_for('admin_routes') }}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Back
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
