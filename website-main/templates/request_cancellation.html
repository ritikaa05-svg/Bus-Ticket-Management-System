<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Request Cancellation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="card">
            <div class="card-header bg-warning">
                <h4>Request Ticket Cancellation</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <h5>Booking Details</h5>
                    <p>
                        <strong>Route:</strong> {{ booking.origin }} → {{ booking.destination }}<br>
                        <strong>Date:</strong> {{ booking.date }} at {{ booking.departure_time }}<br>
                        <strong>Passenger:</strong> {{ booking.passenger_name }}<br>
                        <strong>Seat:</strong> {{ booking.seat_number }}
                    </p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="reason" class="form-label">Reason for Cancellation</label>
                        <textarea class="form-control" id="reason" name="reason" rows="3" required></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger">
                            Submit Cancellation Request
                        </button>
                        <a href="{{ url_for('user_bookings') }}" class="btn btn-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
