<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Route - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="card">
            <div class="card-header bg-warning text-white">
                <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Edit Route #{{ route.id }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Origin</label>
                            <input type="text" class="form-control" name="origin" value="{{ route.origin }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Destination</label>
                            <input type="text" class="form-control" name="destination" value="{{ route.destination }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Departure Time</label>
                            <input type="time" class="form-control" name="departure_time" value="{{ route.departure_time }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" name="date" value="{{ route.date }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Base Price (Rs. )</label>
                            <input type="number" step="0.01" class="form-control" name="price" value="{{ route.price }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Bus Number</label>
                            <input type="text" class="form-control" name="bus_number" value="{{ route.bus_number }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Driver Name</label>
                            <input type="text" class="form-control" name="driver_name" value="{{ route.driver_name }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Driver Contact</label>
                            <input type="text" class="form-control" name="driver_contact" value="{{ route.driver_contact }}" required>
                        </div>
			<div class="col-md-4">
    				<label class="form-label">Total Seats</label>
    				<input type="number" class="form-control" name="total_seats" value="{{ route.total_seats if route else 30 }}" required min="10" max="100">
			</div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Update Route
                            </button>
                            <a href="{{ url_for('admin_routes') }}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
