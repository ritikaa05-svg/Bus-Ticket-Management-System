<!DOCTYPE html>
<html>
<head>
    <title>Data Check</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Database Contents</h2>
        
        <div class="card mb-4">
            <div class="card-header">Record Counts</div>
            <div class="card-body">
                <ul>
                    {% for table, count in counts.items() %}
                    <li>{{ table }}: {{ count }}</li>
                    {% endfor %}
                </ul>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">Sample Routes</div>
                    <div class="card-body">
                        <pre>{{ routes }}</pre>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">Sample Bookings</div>
                    <div class="card-body">
                        <pre>{{ bookings }}</pre>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">Sample Payments</div>
                    <div class="card-body">
                        <pre>{{ payments }}</pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
