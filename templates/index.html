<!DOCTYPE html>
<html>
<head>
    <title>Bus Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .seat-btn.active {
            background-color: #0d6efd;
            color: white;
        }
        .seat-btn.disabled {
            background-color: #ccc !important;
            color: #666 !important;
            pointer-events: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-3">Bus Ticket Booking</h2>

    <!-- Show Schedule Info -->
    <div class="card mb-4">
        <div class="card-body">
            <p><strong>From:</strong> {{ schedule[1] }}</p>
            <p><strong>To:</strong> {{ schedule[2] }}</p>
            <p><strong>Departure:</strong> {{ schedule[3] }} on {{ schedule[4] }}</p>
        </div>
    </div>

    <!-- Seat Selection Buttons -->
    <h5>Select Your Seats:</h5>
    <div class="row mb-4">
        {% for seat in seats %}
            <div class="col-2 mb-2">
                {% set is_booked = seat in booked_seats %}
                <button type="button"
                        class="btn w-100 seat-btn {% if is_booked %}disabled btn-secondary{% else %}btn-outline-success{% endif %}"
                        onclick="toggleSeat(this, '{{ seat }}')"
                        {% if is_booked %}disabled{% endif %}>
                    {{ seat }}
                </button>
            </div>
        {% endfor %}
    </div>

    <!-- Booking Form -->
    <form action="/book" method="POST" id="bookingForm" style="display: none;">
        <div id="passengerInputs"></div>
        <button type="submit" class="btn btn-success">Confirm Booking</button>
    </form>
</div>

<script>
    let selectedSeats = [];

    function toggleSeat(button, seat) {
        const index = selectedSeats.indexOf(seat);
        if (index > -1) {
            selectedSeats.splice(index, 1);
            button.classList.remove("active");
        } else {
            selectedSeats.push(seat);
            button.classList.add("active");
        }
        updateForm();
    }

    function updateForm() {
        const form = document.getElementById("bookingForm");
        const container = document.getElementById("passengerInputs");
        container.innerHTML = '';

        if (selectedSeats.length > 0) {
            form.style.display = 'block';
            selectedSeats.forEach(seat => {
                container.innerHTML += `
                    <div class="card p-3 mb-3">
                        <h6>Seat ${seat}</h6>
                        <input type="hidden" name="seats" value="${seat}">
                        <div class="mb-2">
                            <label>Name:</label>
                            <input type="text" name="name_${seat}" class="form-control" required>
                        </div>
                        <div>
                            <label>Contact:</label>
                            <input type="text" name="contact_${seat}" class="form-control" required>
                        </div>
                    </div>
                `;
            });
        } else {
            form.style.display = 'none';
        }
    }
</script>
</body>
</html>
