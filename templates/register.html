<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Bus Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .register-container {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .form-title {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    .role-select {
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container">
    <div class="register-container">
      <h4 class="form-title">Create Your Account</h4>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      
      <form method="POST" novalidate>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input 
            type="text" 
            name="name" 
            class="form-control" 
            placeholder="John Doe" 
            pattern="^[A-Za-z\s]{2,}$" 
            title="Name must contain only letters and spaces" 
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input 
            type="email" 
            name="email" 
            class="form-control" 
            placeholder="your@email.com" 
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input 
            type="password" 
            name="password" 
            class="form-control" 
            placeholder="Create a password" 
            minlength="6" 
            title="Password must be at least 6 characters" 
            required>
          <small class="text-muted">Use at least 6 characters</small>
        </div>

        <div class="mb-3">
          <label class="form-label">Account Type</label>
          <select name="role" class="form-select role-select" required>
            <option value="" disabled selected>Select your role</option>
            <option value="user">Regular User</option>
            <option value="admin">Administrator</option>
          </select>
        </div>

        <div class="d-grid gap-2 mb-3">
          <button type="submit" class="btn btn-primary">
            Create Account
          </button>
        </div>

        <div class="text-center">
          <small class="text-muted">
            Already have an account? <a href="{{ url_for('login') }}">Sign in here</a>
          </small>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
