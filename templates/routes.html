<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Bus Routes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .route-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .route-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
        }
        .price-tag {
            font-size: 1.2rem;
            font-weight: bold;
            color: #0d6efd;
        }
        .action-btn {
            width: 100%;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">
                <i class="bi bi-bus-front"></i> Available Bus Routes
            </h2>
            <div>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Dashboard
                </a>
            </div>
        </div>

<!-- Add this below the page header -->
<div class="card mb-4">
    <div class="card-body">
        <form method="GET" action="{{ url_for('show_routes') }}" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Origin</label>
                <select name="origin" class="form-select">
                    <option value="">All Origins</option>
                    {% for location in locations %}
                    <option value="{{ location }}" {% if request.args.get('origin') == location %}selected{% endif %}>{{ location }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Destination</label>
                <select name="destination" class="form-select">
                    <option value="">All Destinations</option>
                    {% for location in locations %}
                    <option value="{{ location }}" {% if request.args.get('destination') == location %}selected{% endif %}>{{ location }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Travel Date</label>
                <input type="date" name="date" class="form-control" value="{{ request.args.get('date', '') }}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Price Range</label>
                <select name="price_range" class="form-select">
                    <option value="">Any Price</option>
                    <option value="0-500" {% if request.args.get('price_range') == '0-500' %}selected{% endif %}>Under Rs.500</option>
                    <option value="500-1000" {% if request.args.get('price_range') == '500-1000' %}selected{% endif %}>Rs.500 - Rs.1000</option>
                    <option value="1000" {% if request.args.get('price_range') == '1000' %}selected{% endif %}>Over Rs.1000</option>
                </select>
            </div>
            <div class="col-12 text-end">
                <button type="submit" class="btn btn-primary me-2">
                    <i class="bi bi-search"></i> Search
                </button>
                <a href="{{ url_for('show_routes') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </a>
            </div>
        </form>
    </div>
</div>

        {% if routes %}
        <div class="row">
            {% for route in routes %}
            <div class="col-md-6 col-lg-4">
                <div class="card route-card">
                    <div class="card-header">
                        {{ route.origin }} to {{ route.destination }}
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3">
                            <div>
                                <h6 class="card-subtitle mb-1 text-muted">
                                    <i class="bi bi-calendar"></i> {{ route.date }}
                                </h6>
                                <h6 class="card-subtitle text-muted">
                                    <i class="bi bi-clock"></i> {{ route.departure_time }}
                                </h6>
                            </div>
                            <div class="price-tag">
                                Rs. {{ route.price }}
                            </div>
                        </div>
                        <a href="{{ url_for('book_seats', route_id=route.id) }}" 
                           class="btn btn-primary action-btn">
                            <i class="bi bi-ticket-perforated"></i> Book Seats
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="alert alert-warning text-center py-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> No routes available at the moment.
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
